name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # TODO: run `npm install` locally and commit the refreshed package-lock.json,
      # then switch this to `npm ci` (it currently fails: lock file out of sync).
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm test
